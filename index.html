<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo 3 anos • Confirme sua presença</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf4ff; --card:#fff;
    --vermelho:#e63946; --vermelho-esc:#b5172a;
    --azul:#1d4e9e; --azul-claro:#e8f0ff;
    --amarelo:#ffcc29; --verde:#2a9d6f;
    --texto:#2b2d42; --suave:#6b6f86; --borda:#dfe3ef;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--texto);min-height:100vh;padding:24px 16px 48px;
    background-image:radial-gradient(circle at 10% 5%,#ffe3e5 0,transparent 30%),radial-gradient(circle at 95% 15%,#fff4cc 0,transparent 28%)}
  .wrap{max-width:460px;margin:0 auto}
  header{text-align:center;margin-bottom:20px}
  .topo-emo{font-size:42px}
  h1{font-family:'Baloo 2',cursive;font-size:44px;font-weight:800;color:var(--vermelho);line-height:1;margin-top:4px;text-shadow:2px 2px 0 var(--amarelo)}
  h1 span{color:var(--azul)}
  .info{margin-top:12px;font-size:15px;line-height:1.6}
  .prazo{display:inline-block;margin-top:12px;background:var(--amarelo);padding:6px 16px;border-radius:999px;font-weight:700;font-size:14px}

  .card{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:0 6px 24px rgba(29,78,158,.08);margin-bottom:16px}
  .passo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .num{width:32px;height:32px;border-radius:50%;background:var(--vermelho);color:#fff;font-family:'Baloo 2';font-weight:800;display:grid;place-items:center;font-size:18px;flex-shrink:0}
  .passo h2{font-family:'Baloo 2';font-size:21px;font-weight:700;line-height:1.2}

  input[type=text]{width:100%;padding:14px 16px;font-size:17px;border:2px solid var(--borda);border-radius:14px;font-family:inherit;outline:none}
  input[type=text]:focus{border-color:var(--azul)}

  .sim-nao{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{padding:16px 10px;border:2px solid var(--borda);border-radius:16px;background:#fff;font-family:inherit;font-size:16px;font-weight:700;color:var(--texto);cursor:pointer}
  .opt .emo{display:block;font-size:26px;margin-bottom:4px}
  .opt.sim.ativo{border-color:var(--verde);background:#e8f8f1}
  .opt.nao.ativo{border-color:var(--vermelho);background:#fff0f1}

  .dica{color:var(--suave);font-size:14px;margin:-6px 0 14px}
  .pessoa{border:2px solid var(--borda);border-radius:16px;padding:12px;margin-bottom:12px}
  .pessoa .topo{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .pessoa .titulo{font-weight:700;color:var(--azul);font-size:15px}
  .pessoa .fixo{font-size:17px;font-weight:700;padding:4px 2px 2px}
  .remover{background:none;border:none;color:var(--vermelho);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .tipos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .tipo{padding:10px 6px;border:2px solid var(--borda);border-radius:12px;background:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:var(--texto);line-height:1.25}
  .tipo small{display:block;font-weight:400;color:var(--suave);font-size:12px}
  .tipo.ativo{border-color:var(--azul);background:var(--azul-claro)}
  .add{width:100%;padding:15px;border:2px dashed var(--azul);border-radius:16px;background:var(--azul-claro);color:var(--azul);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
  .total{margin-top:14px;background:#fff8dc;border:2px solid var(--amarelo);border-radius:14px;padding:10px 14px;font-size:15px;text-align:center}

  .enviar{width:100%;padding:18px;border:none;border-radius:18px;background:var(--vermelho);color:#fff;font-family:'Baloo 2';font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 var(--vermelho-esc)}
  .enviar:active{transform:translateY(3px);box-shadow:0 3px 0 var(--vermelho-esc)}
  .enviar:disabled{opacity:.6;cursor:wait}
  .erro{color:var(--vermelho);font-weight:700;font-size:14px;margin-top:10px;text-align:center;min-height:20px}

  .ok{text-align:center;padding:36px 20px}
  .ok .big{font-size:64px}
  .ok h2{font-family:'Baloo 2';font-size:30px;color:var(--azul);margin:8px 0}
  .ok p{color:var(--suave);line-height:1.5}
  .escondido{display:none}
  footer{text-align:center;color:var(--suave);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="topo-emo">🕷️🎂🕸️</div>
    <h1>Theo<br><span>3 anos!</span></h1>
    <p class="info" id="infoFesta"></p>
    <div class="prazo" id="prazoTxt"></div>
  </header>

  <div id="formulario">

    <div class="card">
      <div class="passo"><div class="num">1</div><h2>Qual é o seu nome?</h2></div>
      <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">
    </div>

    <div class="card">
      <div class="passo"><div class="num">2</div><h2>Você vai à festa?</h2></div>
      <div class="sim-nao">
        <button class="opt sim" data-vai="sim"><span class="emo">🥳</span>Sim, vou!</button>
        <button class="opt nao" data-vai="nao"><span class="emo">😢</span>Não vou poder</button>
      </div>
    </div>

    <div class="card escondido" id="cardQtd">
      <div class="passo"><div class="num">3</div><h2>Quem vai?</h2></div>
      <p class="dica">Você já está na lista. Adicione cada pessoa da família que vai junto.</p>
      <div id="lista"></div>
      <button class="add" id="btnAdd">➕ Adicionar pessoa</button>
      <div class="total" id="total"></div>
    </div>

    <button class="enviar" id="btnEnviar">Enviar resposta</button>
    <p class="erro" id="erro"></p>
  </div>

  <div class="card ok escondido" id="sucesso">
    <div class="big" id="okEmo">🎉</div>
    <h2 id="okTitulo">Presença confirmada!</h2>
    <p id="okTexto"></p>
  </div>

  <footer>Feito com carinho para o Theo 💙</footer>
</div>

const $ = id => document.getElementById(id);
let vai = null;
// pessoas[0] é sempre quem está respondendo
let pessoas = [{nome:"", tipo:"adulto"}];
const TIPOS = {adulto:"Adulto", crianca:"Criança (até 10 anos)"};

$("infoFesta").innerHTML = `📅 <b>${CONFIG.DATA_FESTA}</b> às <b>${CONFIG.HORARIO}</b><br>📍 ${CONFIG.LOCAL}`;
$("prazoTxt").textContent = new Date() > new Date(CONFIG.PRAZO_FIM)
  ? "Prazo de confirmação encerrado" : `Confirme até ${CONFIG.PRAZO_TEXTO}`;
if (CONFIG.IMAGEM_CONVITE){
  const img = document.createElement("img");
  img.src = CONFIG.IMAGEM_CONVITE; img.alt = "Convite";
  img.onerror = () => img.remove();
  img.style.cssText = "width:100%;border-radius:18px;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.15)";
  document.querySelector("header").before(img);
  document.querySelector(".topo-emo").remove();
  document.querySelector("h1").remove();
}

document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
  vai = b.dataset.vai;
  document.querySelectorAll(".opt").forEach(x => x.classList.toggle("ativo", x === b));
  $("cardQtd").classList.toggle("escondido", vai !== "sim");
  $("btnEnviar").textContent = vai === "sim" ? "Confirmar presença 🎉" : "Enviar resposta";
  desenhar();
});

$("nome").oninput = () => { pessoas[0].nome = $("nome").value; desenhar(); };

$("btnAdd").onclick = () => {
  pessoas.push({nome:"", tipo:""});
  desenhar();
  const ins = document.querySelectorAll("#lista input");
  ins[ins.length-1].focus();
};

function desenhar(){
  $("lista").innerHTML = pessoas.map((p,i) => `
    <div class="pessoa">
      <div class="topo">
        <span class="titulo">${i === 0 ? "Você" : "Pessoa " + (i+1)}</span>
        ${i === 0 ? "" : `<button class="remover" data-i="${i}">✕ remover</button>`}
      </div>
      ${i === 0
        ? `<div class="fixo">${esc(p.nome) || "<i style='color:#999;font-weight:400'>(escreva seu nome no passo 1)</i>"}</div>`
        : `<input type="text" data-i="${i}" placeholder="Nome" value="${esc(p.nome)}">`}
      <div class="tipos">
        <button class="tipo ${p.tipo==='adulto'?'ativo':''}" data-i="${i}" data-t="adulto">🧑 Adulto<small>11 anos ou mais</small></button>
        <button class="tipo ${p.tipo==='crianca'?'ativo':''}" data-i="${i}" data-t="crianca">🧒 Criança<small>até 10 anos</small></button>
      </div>
    </div>`).join("");

  document.querySelectorAll("#lista input").forEach(inp =>
    inp.oninput = () => { pessoas[inp.dataset.i].nome = inp.value; contar(); });
  document.querySelectorAll(".tipo").forEach(b =>
    b.onclick = () => { pessoas[b.dataset.i].tipo = b.dataset.t; desenhar(); });
  document.querySelectorAll(".remover").forEach(b =>
    b.onclick = () => { pessoas.splice(b.dataset.i, 1); desenhar(); });
  $("btnAdd").textContent = pessoas.length > 1 ? "➕ Adicionar mais uma pessoa" : "➕ Adicionar pessoa";
  contar();
}

function contar(){
  const a = pessoas.filter(p => p.tipo === "adulto").length;
  const c = pessoas.filter(p => p.tipo === "crianca").length;
  $("total").innerHTML = `Total: <b>${plural(a,"adulto","adultos")}</b> e <b>${plural(c,"criança","crianças")}</b>`;
}

$("btnEnviar").onclick = async () => {
  $("erro").textContent = "";
  const nome = $("nome").value.trim();
  if (!nome) return erro("Escreva o seu nome no passo 1.");
  if (!vai)  return erro("Responda se você vai no passo 2.");
  pessoas[0].nome = nome;

  if (vai === "sim"){
    for (let i = 0; i < pessoas.length; i++){
      if (!pessoas[i].nome.trim()) return erro(`Escreva o nome da pessoa ${i+1}.`);
      if (!pessoas[i].tipo) return erro(`Escolha se ${pessoas[i].nome.trim()} é adulto ou criança.`);
    }
  }

  const lista = vai === "sim"
    ? pessoas.map(p => ({nome: p.nome.trim(), tipo: TIPOS[p.tipo]}))
    : [{nome, tipo: TIPOS.adulto}];
  const dados = {
    familia: nome, vai, pessoas: lista,
    adultos:  vai === "sim" ? pessoas.filter(p => p.tipo === "adulto").length : 0,
    criancas: vai === "sim" ? pessoas.filter(p => p.tipo === "crianca").length : 0
  };

  if (CONFIG.SCRIPT_URL){
    $("btnEnviar").disabled = true; $("btnEnviar").textContent = "Enviando...";
    try{
      await fetch(CONFIG.SCRIPT_URL, {method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(dados)});
      sucesso(dados);
    }catch(e){
      $("btnEnviar").disabled = false; $("btnEnviar").textContent = "Tentar de novo";
      erro("Não consegui enviar. Verifique a internet e tente de novo.");
    }
  } else { enviarWhats(dados); sucesso(dados); }
};

function plural(n, s, p){ return `${n} ${n === 1 ? s : p}`; }

function enviarWhats(d){
  let m = `🕷️ *Festa do Theo — 3 anos*\n\n`;
  if (d.vai === "nao") m += `${d.familia} não poderá ir. 😢`;
  else {
    m += `✅ *${d.familia}* confirmou!\n\n` + d.pessoas.map(p => `• ${p.nome} — ${p.tipo}`).join("\n");
    m += `\n\n🧑 ${plural(d.adultos,"adulto","adultos")} | 🧒 ${plural(d.criancas,"criança","crianças")}`;
  }
  window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(m)}`, "_blank");
}

function sucesso(d){
  $("formulario").classList.add("escondido"); $("sucesso").classList.remove("escondido");
  if (d.vai === "nao"){
    $("okEmo").textContent = "💙"; $("okTitulo").textContent = "Obrigado por avisar!";
    $("okTexto").textContent = "Vamos sentir sua falta.";
  } else {
    $("okTexto").innerHTML = `Obrigado, <b>${esc(d.familia)}</b>! Confirmamos <b>${plural(d.adultos,"adulto","adultos")}</b>` +
      (d.criancas ? ` e <b>${plural(d.criancas,"criança","crianças")}</b>` : "") + `. Te esperamos lá! 🎂`;
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

desenhar();

function erro(t){ $("erro").textContent = t; }
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
</script>
</body>
</html>
